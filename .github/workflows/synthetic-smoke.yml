# Smoke tests sintéticos (Fase 0 + Fase 1).
# Cron deve espelhar MONITOR_SMOKE_CRON em monitor/monitor.config.env
name: Synthetic Smoke Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sincronização do cron
        run: python monitor/scripts/check_schedule_sync.py

  smoke:
    needs: validate-schedule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do monitor
        run: pip install -r monitor/requirements.txt

      - name: Exportar configuração por Python
        run: python monitor/scripts/export_github_env.py

      - name: Executar smoke tests
        working-directory: monitor
        env:
          MONITOR_E2E_EMAIL: ${{ secrets.MONITOR_E2E_EMAIL }}
          MONITOR_E2E_PASSWORD: ${{ secrets.MONITOR_E2E_PASSWORD }}
        run: python scripts/run_smoke.py

  notify:
    if: ${{ always() }}
    needs: [validate-schedule, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências do monitor
        run: pip install -r monitor/requirements.txt
      - name: Exportar configuração por Python
        run: python monitor/scripts/export_github_env.py
      - name: Atualizar estado e alertas
        working-directory: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.MONITOR_ALERT_WEBHOOK_URL }}
          MONITOR_RUN_STATUS: ${{ needs.validate-schedule.result == 'success' && needs.smoke.result == 'success' && 'success' || 'failure' }}
        run: python scripts/alert_state.py --status "$MONITOR_RUN_STATUS"
